<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Emma Unbound</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1330; }
  body { display: flex; align-items: center; justify-content: center;
         font-family: ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #canvas { width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16));
            display: block; background: #9be0ff; }
  #loading { position: fixed; color: #fff; font-size: 22px; font-weight: 900; }
  .pad { position: fixed; bottom: 18px; display: none; gap: 14px; }
  #padL { left: 18px; } #padR { right: 18px; }
  .pad button { width: 72px; height: 72px; border-radius: 50%; border: 4px solid #2b1b3f;
                background: rgba(255, 255, 255, .55); color: #2b1b3f; font: 900 26px inherit; padding: 0; touch-action: none; }
  .pad { align-items: flex-end; } .pad .col { display: flex; flex-direction: column; gap: 10px; }
  .pad .col button { width: 60px; height: 52px; border-radius: 18px; } .pad button.jump { font-size: 16px; }
  .pad button.on { background: rgba(255, 212, 71, .9); }
  @media (pointer: coarse) { .pad { display: flex; } }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="loading">Loading…</div>
<div class="pad" id="padL"><button data-b="0">◀</button><div class="col"><button data-b="5">▲</button><button data-b="6">▼</button></div><button data-b="1">▶</button></div>
<div class="pad" id="padR"><button data-b="3">✊</button><button data-b="2" class="jump">JUMP</button></div>
<script>
  var Module = {
    onRuntimeInitialized: function () {
      document.getElementById('loading').remove();
      var m = /^#level(\d)$/.exec(location.hash);   // e.g. index.html#level2 starts in level 2
      if (m) Module._emma_goto_level(+m[1]);
    }
  };
  function press(id, down) { if (Module._emma_button) Module._emma_button(id, down ? 1 : 0); }
  document.querySelectorAll('.pad button').forEach(function (b) {
    var id = +b.dataset.b;
    function set(down) { return function (e) { e.preventDefault(); b.classList.toggle('on', down); press(id, down); }; }
    b.addEventListener('pointerdown', set(true));
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { b.addEventListener(n, set(false)); });
  });
  document.getElementById('canvas').addEventListener('pointerdown', function () { press(4, true); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
</script>
<script src="emma.js"></script>
</body>
</html>
